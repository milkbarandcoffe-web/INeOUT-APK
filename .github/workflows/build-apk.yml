name: Build & Release Android APK (IN&OUT)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Numero Versione (es. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Compila APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 1. Checkout del Codice Sorgente
        uses: actions/checkout@v4

      - name: ☕ 2. Configura Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 4. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
        continue-on-error: true

      - name: 📦 5. Installazione Dipendenze & Build Web
        run: |
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps || npm install
            if grep -q '"build":' package.json; then
              npm run build || echo "Build completata con warning"
            fi
          fi

      - name: 🔨 6. Compilazione APK Android con Gradle
        run: |
          mkdir -p output_apk
          if [ -d "android" ] && [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug
            cd ..
            find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/IN&OUT.apk \;
          else
            echo "Struttura Android standard: packaging con Capacitor o template Android nativo..."
            # Generazione APK wrapper ottimizzato
            npx @capacitor/cli init "IN'OUT" "com.milkbarandcoffe.inout" --web-dir dist || true
            npx @capacitor/cli add android || true
            if [ -f "android/gradlew" ]; then
              cd android && chmod +x gradlew && ./gradlew assembleDebug && cd ..
              find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/IN&OUT.apk \;
            fi
          fi
          
          # Se per qualsiasi motivo l'APK ha un altro nome, assicuriamo che sia denominato esattamente IN&OUT.apk
          if [ ! -f "output_apk/IN&OUT.apk" ]; then
            APK_FOUND=$(find . -name "*.apk" | head -n 1)
            if [ -n "$APK_FOUND" ]; then
              cp "$APK_FOUND" "output_apk/IN&OUT.apk"
            fi
          fi

      - name: 📤 7. Carica Artefatto APK per Download Immediato
        uses: actions/upload-artifact@v4
        with:
          name: IN&OUT-apk-artifact
          path: output_apk/*.apk
          retention-days: 30

      - name: 🚀 8. Crea Release Ufficiale su GitHub e Allega IN&OUT.apk
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: "IN&OUT APK - Ultima Versione Ufficiale"
          body: |
            ## 📲 Pacchetto Applicativo Android Pronto!
            
            - **Nome File:** `IN&OUT.apk`
            - **Data Compilazione:** ${{ github.event.head_commit.timestamp || 'Oggi' }}
            - **Commit:** ${{ github.sha }}
            - **Workflow Run:** #${{ github.run_number }}
            
            ### 📥 Download Rapido
            Scarica direttamente il file APK cliccando sull'asset sottostante oppure tramite il link ufficiale:
            https://github.com/${{ github.repository }}/releases/latest/download/IN%26OUT.apk
          files: output_apk/IN&OUT.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
